name: Refresh roles (free feeds, every 6 hours)

# Pulls every company's public ATS / careers JSON feed and commits the
# regenerated src/roles.ts on the main branch. No API keys needed.
# Runs every 6 hours + on demand. The monthly RapidAPI drip lives in
# refresh-roles-monthly.yml (separate quota).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch roles from public feeds
        run: python3 scripts/fetch-roles.py
      - name: Re-apply Playwright scraper roles
        run: python3 scripts/scrape-playwright/merge.py


      - name: Commit if changed
        run: |
          git config user.name "roles-bot"
          git config user.email "roles-bot@users.noreply.github.com"
          git add src/roles.ts src/roleDescriptions.ts
          if git diff --cached --quiet; then
            echo "no role changes"
          else
            git commit -m "chore: roles refresh $(date -u +%F-%H%M)"
            git push origin main
          fi
